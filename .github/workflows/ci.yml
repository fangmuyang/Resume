/**
 * CI 主流程：内容校验、类型检查、Lint、单元测试、构建、E2E。
 *
 * ## 四个设计决定
 *
 * ### 一、用 `pnpm/action-setup` 而不是 `npm install -g pnpm`
 *
 * 它会读根 `package.json` 的 `packageManager` 字段并缓存 store。
 * 版本写死在 `package.json` 里，本地与 CI 不会跑出不同的 pnpm。
 *
 * ### 二、校验与 E2E 分成两个 job
 *
 * `verify` 快（约 1 分钟），`e2e` 慢（含浏览器安装与构建，约 3 分钟）。
 * 分开之后：校验失败会**立刻**给反馈；两个 job 并行，总时长由慢的决定。
 *
 * `e2e` 仍然 `needs: verify` —— 内容校验或类型检查都过不了时，
 * 再花三分钟跑 E2E 没有意义。
 *
 * ### 三、`--frozen-lockfile` 不能省
 *
 * 默认行为是"锁文件与 package.json 不一致时自动更新锁文件"，
 * 在 CI 上这意味着**依赖可能与你本地不同**，构建结果就不可复现了。
 * 加上这个参数，不一致会直接失败，逼你先把锁文件提交好。
 *
 * ### 四、Node 版本用 `node-version` 而不是 `node-version-file`
 *
 * `node-version-file` 只认 `.nvmrc` / `.node-version` 这类文件，
 * **不读 `package.json` 的 `engines`**。写成 `node-version-file: site/package.json`
 * 会让 setup-node 找不到版本文件而失败（或静默回退到默认版本）。
 * 这里用 `22.18` 与 `engines` 的下限保持一致。
 */
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发，便于在没有新提交时重跑
  workflow_dispatch:

# 同一分支的旧运行自动取消：省额度，也避免旧结果干扰判断
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 package.json 的 engines 下限一致；本项目需要 Node 22.18+ 才能直接 import .ts
  NODE_VERSION: '22.18'

jobs:
  verify:
    name: 校验（内容 / 类型 / Lint / 单测）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: 内容校验、类型检查、Lint、单元测试
        working-directory: site
        run: pnpm run check

      - name: 构建
        working-directory: site
        run: pnpm run build

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: site/dist
          # 产物只用于排错；部署走独立的 deploy 工作流
          retention-days: 7

  e2e:
    name: 端到端测试（桌面 + 移动端）
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: 安装 Playwright 浏览器
        working-directory: site
        # --with-deps 会一并安装 Chromium 需要的系统库；
        # 缺了它浏览器起不来，而报错信息不容易看出是这个原因
        run: pnpm exec playwright install --with-deps chromium

      - name: 构建产物
        working-directory: site
        # E2E 跑的是生产构建产物，不是 dev server ——
        # base 前缀、资源哈希、代码分割都只在生产构建里才生效
        run: pnpm run build

      - name: 运行 E2E
        working-directory: site
        # 告诉 playwright.config.ts 用自带的 Chromium，而不是系统 Chrome
        env:
          E2E_BROWSER: chromium
        run: pnpm run test:e2e

      - name: 上传失败报告
        # 测试失败时最需要排错资料，所以用 always() 保证这一步仍会执行
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
