# pnpm 11 workspace configuration.
# In pnpm 11 most settings live here (camelCase), not in .npmrc.
# Keep this file ASCII-only: non-ASCII content can be mangled by the Windows
# ANSI codepage when the file has no BOM.

# Flat npm-style node_modules layout instead of pnpm's default isolated
# junction layout. Set this if ESM resolution through junctions fails on your
# machine (symptom: "Cannot find package 'rollup'" from Vite).
nodeLinker: hoisted

# Recreate node_modules without an interactive prompt when the layout changes.
# Needed in CI and in non-TTY environments.
confirmModulesPurge: false

# pnpm 11 blocks dependency install scripts (postinstall) by default.
# These two need their install script to place a platform binary:
#
#   esbuild - Vite's bundler, a direct devDependency.
#
#   sharp   - NOT a direct dependency. It comes in transitively through
#             vite-plugin-pwa -> @vite-pwa/assets-generator. We do not use
#             that generator: icons are produced by scripts/build-icons.ts
#             with Python/Pillow, because sharp needs a platform-specific
#             binary download that is blocked in restricted networks.
#             It is listed here only so that `pnpm install` does not report
#             unapproved build scripts and abort.
#
# Warning: running `pnpm approve-builds` interactively rewrites this section
# and can write the literal string "set this to true or false" as a value,
# which then breaks every later install. Keep the values as real booleans.
allowBuilds:
  esbuild: true
  sharp: true

# pnpm 11 supply-chain protection: newly published versions are not adopted
# during an observation window. These are deliberate, exact-version exceptions
# rather than a blanket opt-out.
minimumReleaseAgeExclude:
  - prettier@3.9.10
